components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Access token returned by `GenAcsTok`.
  schemas:
    ErrorResponse:
      type: object
      required:
      - stat
      - emsg
      properties:
        stat:
          type: string
          enum:
          - Not_Ok
        emsg:
          type: string
          description: 'Human-readable error detail, e.g. `Session Expired : Invalid Session Key`.'
        request_time:
          type: string
          description: Server time of the response.
    GenericObject:
      type: object
      description: Endpoint response whose field list is not yet documented in this spec. Check `stat`
        first.
      properties:
        stat:
          type: string
          enum:
          - Ok
          - OK
          - Not_Ok
        emsg:
          type: string
          description: Present only when `stat` is `Not_Ok`.
        request_time:
          type: string
      additionalProperties: true
    GenericResponse:
      description: Either an object with `stat`, or an array of objects for list endpoints.
      oneOf:
      - $ref: '#/components/schemas/GenericObject'
      - type: array
        items:
          $ref: '#/components/schemas/GenericObject'
    OrderBookItem:
      type: object
      properties:
        stat:
          type: string
        exch:
          type: string
          description: Exchange segment
        tsym:
          type: string
          description: Trading symbol / contract
        norenordno:
          type: string
          description: Noren order number
        prc:
          type: string
          description: Order price
        qty:
          type: string
          description: Order quantity
        prd:
          type: string
          description: Product alias name (from `prarr` in User Details)
        status:
          type: string
          description: Order status, e.g. OPEN, COMPLETE, REJECT
        trantype:
          type: string
          description: Transaction type
          enum:
          - B
          - S
        prctyp:
          type: string
          description: Price type (LMT / MKT / ...)
        fillshares:
          type: string
          description: Total traded quantity
        avgprc:
          type: string
          description: Average trade price
        rejreason:
          type: string
          description: Rejection reason (rejected orders only)
        exchordid:
          type: string
          description: Exchange order number
        cancelqty:
          type: string
          description: Cancelled quantity
        remarks:
          type: string
          description: Tag entered at order entry
        dscqty:
          type: string
          description: Disclosed quantity
        trgprc:
          type: string
          description: Trigger price
        ret:
          type: string
          description: Order validity
          enum:
          - DAY
          - IOC
          - EOS
        uid:
          type: string
        actid:
          type: string
        bpprc:
          type: string
          description: Book profit price (bracket orders)
        blprc:
          type: string
          description: Book loss price (H and B products)
        trailprc:
