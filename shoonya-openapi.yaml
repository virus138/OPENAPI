                jData:
                  $ref: '#/components/schemas/SpanCalcRequest'
            encoding:
              jData:
                contentType: application/json
            example:
              jData:
                actid: USER_ID
                pos:
                - prd: M
                  exch: NFO
                  instname: OPTIDX
                  symname: NIFTY
                  exd: 29-DEC-2022
                  optt: CE
                  strprc: '11900.00'
                  buyqty: '0'
                  sellqty: '0'
                  netqty: '50'
          text/plain:
            schema:
              type: string
              description: Raw body of the form `jData=<compact JSON>`.
              example: jData={"actid":"USER_ID","pos":[{"prd":"M","exch":"NFO","instname":"OPTIDX","symname":"NIFTY","exd":"29-DEC-2022","optt":"CE","strprc":"11900.00","buyqty":"0","sellqty":"0","netqty":"50"}]}
      responses:
