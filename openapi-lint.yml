name: Validate OpenAPI spec

on:
  push:
    paths:
      - 'openapi/**'
  pull_request:
    paths:
      - 'openapi/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lint spec
        run: npx --yes @redocly/cli@1.34.5 lint openapi/shoonya-openapi.yaml

      - name: YAML and JSON must match
        run: |
          pip install pyyaml
          python - <<'PY'
          import json, yaml
          y = yaml.safe_load(open('openapi/shoonya-openapi.yaml'))
          j = json.load(open('openapi/shoonya-openapi.json'))
          assert y == j, 'shoonya-openapi.yaml and shoonya-openapi.json differ'
          print('YAML and JSON are identical')
          PY
